name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    name: End-to-end (headless Firefox, same WebDriver BiDi engine as Zen)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: browser-actions/setup-firefox@v1
        id: firefox
        with:
          firefox-version: latest
      - name: Run e2e tests
        run: npm run test:e2e
        env:
          ZEN_BINARY: ${{ steps.firefox.outputs.firefox-path }}
